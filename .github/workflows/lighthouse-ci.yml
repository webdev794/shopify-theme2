name: Shopify Lighthouse CI

on:
  push:
    branches:
      - v3
  pull_request:
    branches:
      - v3

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lhci:
    name: Lighthouse
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Authenticate with Shopify
        run: |
          shopify auth token --token ${{ secrets.SHOPIFY_THEME_TOKEN }}
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_THEME_TOKEN }}

      - name: Push theme to Shopify
        run: shopify theme push --theme=157305929906 --path=. --store=suvara-beauty.myshopify.com --allow-live --force
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_THEME_TOKEN }}
          SHOPIFY_FLAG_STORE: suvara-beauty.myshopify.com

      - name: Authenticate with storefront password
        id: auth
        run: |
          curl -c cookies.txt -b cookies.txt -L -s -o response.html -X POST "https://suvara-beauty.myshopify.com/password" \
            --data-urlencode "form_type=storefront_password" \
            --data-urlencode "utf8=✓" \
            --data-urlencode "password=${{ secrets.STORE_PASSWORD }}"
          COOKIE=$(awk -F'\t' 'NF==7 {printf "%s=%s; ", $6, $7}' cookies.txt)
          echo "cookie=$COOKIE" >> "$GITHUB_OUTPUT"

      - name: Write Lighthouse config with auth cookie
        run: |
          cat > lighthouserc.json << EOF
          {
            "ci": {
              "collect": {
                "url": ["https://suvara-beauty.myshopify.com/"],
                "settings": {
                  "extraHeaders": "{\"Cookie\": \"${{ steps.auth.outputs.cookie }}\"}"
                }
              },
              "assert": {
                "assertions": {
                  "categories:performance": ["warn", {"minScore": 0.8}],
                  "categories:accessibility": ["warn", {"minScore": 0.9}],
                  "categories:best-practices": ["warn", {"minScore": 0.8}],
                  "categories:seo": ["warn", {"minScore": 0.8}]
                }
              }
            }
          }
          EOF

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Show live report link
        if: always()
        run: |
          echo "Live Lighthouse report(s):"
          if [ -f .lighthouseci/links.json ]; then
            cat .lighthouseci/links.json
          else
            echo "No links.json found - check artifacts below"
          fi

      - name: Print Lighthouse scores
        if: always()
        run: |
          for report in .lighthouseci/*.json; do
            if [ -f "$report" ]; then
              echo "=== $report ==="
              node -e "
                const fs = require('fs');
                const data = JSON.parse(fs.readFileSync('$report', 'utf8'));
                if (data.categories) {
                  console.log('Performance:', Math.round(data.categories.performance.score * 100));
                  console.log('Accessibility:', Math.round(data.categories.accessibility.score * 100));
                  console.log('Best Practices:', Math.round(data.categories['best-practices'].score * 100));
                  console.log('SEO:', Math.round(data.categories.seo.score * 100));
                }
              "
            fi
          done

      - name: Upload Lighthouse Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/